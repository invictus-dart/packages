version: 1.0.0-dev.0
repository: https://github.com/invictus-dart/packages/tree/master/src/zstd
topics:
  - zstd
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hooks: ^2.0.0
  code_assets: ^2.2.0
  native_toolchain_x: ^1.0.0-dev.0
  ffi: ^2.1.4
  record_use: ^1.1.0
  meta: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  ffigen: ^23.0.0
