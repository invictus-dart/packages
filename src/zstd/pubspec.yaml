name: zstd
description: >-
  Zstandard, or zstd as short version, is a fast lossless compression algorithm,
  targeting real-time compression scenarios at zlib-level and better compression ratios.
  It's backed by a very fast entropy stage, provided by Huff0 and FSE library.
version: 0.0.1
# repository: https://github.com/invictus-dart/packages/tree/main/src/zstd
topics:
  - zstd
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hooks: ^2.0.0
  code_assets: ^2.1.0
  native_toolchain_zeekr: ^1.0.0
  ffi: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
  ffigen: ^23.0.0
