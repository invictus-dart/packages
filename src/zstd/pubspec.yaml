name: zstd
description: >-
  Zstandard, or zstd as short version, is a fast lossless compression algorithm,
  targeting real-time compression scenarios at zlib-level and better compression ratios.
  It's backed by a very fast entropy stage, provided by Huff0 and FSE library.
version: 1.0.0
# repository: https://github.com/invictus-dart/packages/tree/master/src/zstd
topics:
  - zstd
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hooks: ^2.0.0
  code_assets: ^2.1.0
  native_toolchain_x: ^1.0.0
  ffi: ^2.1.4
  record_use: ^1.1.0
  meta: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  ffigen: ^23.0.0
