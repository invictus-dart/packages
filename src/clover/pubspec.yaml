name: clover
description: >-
  A lightweight MVVM framework for Flutter. It provides a ViewModel base
  class and a ViewModelBinding widget that rebuild views when the view
  model notifies changes.
version: 4.0.2
repository: https://github.com/invictus-dart/packages/tree/master/src/clover
topics:
  - clover
  - mvvm
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  mockito: ^5.8.1
