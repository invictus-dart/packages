name: native_toolchain_x
description: >-
  A library to invoke the native C compiler installed on the host machine, with
  CMake and repository builders for building third-party sources in native
  assets hooks.
version: 1.0.0-dev.0
repository: https://github.com/invictus-dart/packages/tree/master/src/native_toolchain_x
topics:
  - compiler
  - ffi
  - interop
  - native-assets
  - native-toolchain
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hooks: ^2.0.0
  code_assets: ^2.1.0
  logging: ^1.3.0
  meta: ^1.19.0
  glob: ^2.1.3
  file: ^7.0.1
  process: ^5.0.6
  pub_semver: ^2.2.0
  crypto: ^3.0.8
  change_case: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
