# Run with `dart run ffigen --config ffigen.yaml`.
name: MarsBindings
description: |
  Bindings for `src/mars.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/mars_bindings_generated.dart'
headers:
  entry-points:
    - 'src/mars.h'
  include-directives:
    - 'src/mars.h'
ffi-native:
comments:
  style: any
  length: full
